[palettes.catppuccin_frappe]
os_fg = "#232634"
os_bg = "#e78284"
dir_fg = "#232634"
dir_bg = "#ef9f76"
git_fg = "#232634"
git_bg = "#e5c890"
tool_fg = "#232634"
tool_bg = "#a6d189"
time_fg = "#232634"
time_bg = "#72b1ce"
dur_fg = "#a0a9cb"
dur_bg = "#121417"

[status]
disabled = false
format = "[ Status $status(: $common_meaning)(\\($signal_number: $signal_name\\))](bold red)\n"

[os]
disabled = false
format = "$symbol"
[os.symbols]
Windows = "  "
Ubuntu = "  "

[directory]
format = "( 󰝰 $path )"
use_os_path_sep = false
truncate_to_repo = false
truncation_length = 6
truncation_symbol = "…/"

[git_branch]
format = "(  $branch(:$remote_branch) )"

[git_status]
format = "($conflicted$staged$renamed$modified$deleted$untracked$ahead_behind )"
conflicted = " "
staged = "+$count"
modified = "~$count"
deleted = "-$count"
renamed = "»$count"
untracked = "?$count"
ahead = " ⇡"
behind = " ⇣"

[nodejs]
format = "  ($version)"

[python]
format = "  $pyenv_prefix($version)(\\($virtualenv\\))"

[rust]
format = "  ($version)"

[time]
disabled = false
format = "(  $time )"

[cmd_duration]
format = "( 󱦟 $duration )"
show_milliseconds = true
min_time = 0

[character]
format = "[](#007acc) "
