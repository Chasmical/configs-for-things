"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
continuation_prompt = "[](#007acc) "

format = """
$status\
[](fg:os_bg)\
[$os](fg:os_fg bg:prev_fg)\
[](fg:prev_bg bg:dir_bg)\
[$directory](fg:dir_fg bg:prev_bg)\
(\
  [](fg:prev_bg bg:git_bg)\
  [$git_branch$git_status](fg:git_fg bg:prev_bg)\
)\
(\
  [](fg:prev_bg bg:tool_bg)\
  [$nodejs$rust$python ](fg:tool_fg bg:prev_bg)\
)\
[](fg:prev_bg bg:time_bg)\
[$time](fg:time_fg bg:prev_bg)\
(\
  [](fg:prev_bg bg:dur_bg)\
  [$cmd_duration](fg:dur_fg bg:prev_bg)\
)\
[](fg:prev_bg)\
\n$character"""

# TODO: Output previous command's status code and error message

# palette = "unicorn"
palette = "tokyo_night"
# palette = "gruvbox_rainbow"
# palette = "catppuccin_mocha"
# palette = "catppuccin_frappe"

