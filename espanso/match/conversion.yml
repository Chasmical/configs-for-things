# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:

  - label: "Length unit conversion (metric ⇔ imperial)"
    regex: "\\\\(?P<NUM>[\\d./]+)(?P<FROM>in|ft|yd|mi|[mck]?m) "
    replace: "{{result}}"
    vars:
      - name: result
        type: script
        params:
          args:
            - python
            - -c
            - |-
              metric = ["mm", "cm", "m", "km"]
              imperial = ["in", "ft", "yd", "mi"]
              map = {
                "mm": 0.001, "cm": 0.01, "m": 1, "km": 1000,
                "in": 0.0254, "ft": 0.3048, "yd": 0.9144, "mi": 1609.344,
              }

              num = ({{NUM}}) * map["{{FROM}}"]
              precision = len("{{NUM}}.000".split(".")[1])

              if "{{FROM}}" in metric:
                unit = "in" if num < map["ft"] \
                  else "ft" if num < 0.1*map["mi"] \
                  else "mi"
              else:
                unit = "mm" if num < map["cm"] \
                  else "cm" if num < map["m"] \
                  else "m"  if num < map["km"] \
                  else "km"

              print(f"{num / map[unit]:.{precision}f}".rstrip('0').rstrip('.') + unit)

  - label: "Speed unit conversion (m/s ⇔ km/h ⇔ mi/h)"
    regex: "\\\\(?P<NUM>[\\d./]+)(?P<DIST>k?m|k|mi)(?P<PER>[p/])(?P<TIME>[sh]) "
    replace: "{{result}}"
    vars:
      - name: result
        type: script
        params:
          args:
            - python
            - -c
            - |-
              dist = "mi" if "{{DIST}}{{PER}}" == "mp" \
                else "km" if "{{DIST}}" == "k" \
                else "{{DIST}}"

              map = {
                "m": 1, "km": 1000, "mi": 1609.344,
                "s": 1, "h": 1.0/3600,
              }

              num = ({{NUM}}) * map[dist] * map["{{TIME}}"]
              precision = len("{{NUM}}.000".split(".")[1])

              # m/s or m/h => km/h or km/s
              # kph => mph, km/s => km/h, km/h => m/s
              # mph => km/h, mi/h => m/s or km/s

              if dist == "m":
                to_dist, to_time = ("km", "h") if num < 1000 \
                  else ("km", "s")
              elif dist == "km":
                to_dist, to_time = ("mi", "h") if "{{PER}}" == "p" \
                  else ("km", "h") if "{{TIME}}" == "s" \
                  else ("m", "s")
              else:
                to_dist, to_time = ("km", "h") if "{{PER}}" == "p" and num < 1000 \
                  else ("m", "s") if num < 1000 \
                  else ("km", "s")

              unit = f"{to_dist}/{to_time}"
              if unit == "mi/h":
                unit = "mph"

              print(f"{num / map[to_dist] / map[to_time]:.{precision}f}".rstrip('0').rstrip('.') + unit)

  - label: "Volume unit conversion (metric ⇔ imperial)"
    regex: "\\\\(?P<NUM>[\\d./]+)(?P<FROM>floz|pt|gal|m³|m\\^3|m?l) "
    replace: "{{result}}"
    vars:
      - name: result
        type: script
        params:
          args:
            - python
            - -c
            - |-
              metric = ["ml", "l", "m³", "m^3"]
              imperial = ["floz", "pt", "gal"]
              map = {
                "ml": 0.001, "l": 1, "m³": 1000, "m^3": 1000,
                "floz": 0.0284130625, "pt": 0.56826125, "gal": 4.54609,
              }

              num = ({{NUM}}) * map["{{FROM}}"]
              precision = len("{{NUM}}.000".split(".")[1])

              if "{{FROM}}" in metric:
                unit = "floz" if num < map["pt"] \
                  else "pt" if num < map["gal"] \
                  else "gal"
              else:
                unit = "ml" if num < map["l"] \
                  else "l"  if num < map["m³"] \
                  else "m³"

              print(f"{num / map[unit]:.{precision}f}".rstrip('0').rstrip('.') + unit)

  - label: "Mass unit conversion (metric ⇔ imperial)"
    regex: "\\\\(?P<NUM>[\\d./]+)(?P<FROM>oz|lb|st|ton|[mk]?g|tn?) "
    replace: "{{result}}"
    vars:
      - name: result
        type: script
        params:
          args:
            - python
            - -c
            - |-
              metric = ["mg", "g", "kg", "t", "tn"]
              imperial = ["oz", "lb", "st"]
              map = {
                "mg": 0.000001, "g": 0.001, "kg": 1, "t": 1000, "tn": 1000,
                "oz": 0.028349523125, "lb": 0.45359237, "st": 6.35029318, "ton": 1016.0469088,
              }

              num = ({{NUM}}) * map["{{FROM}}"]
              precision = len("{{NUM}}.000".split(".")[1])

              if "{{FROM}}" in metric:
                unit = "oz" if num < map["lb"] \
                  else "lb" if num < map["ton"] \
                  else "ton"
              else:
                unit = "mg" if num < map["g"] \
                  else "g"  if num < map["kg"] \
                  else "kg" if num < map["t"] \
                  else "t"

              print(f"{num / map[unit]:.{precision}f}".rstrip('0').rstrip('.') + unit)

  - label: "Temperature unit conversion (Celsius ⇔ Fahrenheit)"
    regex: "\\\\(?P<NUM>-?[\\d./]+)(?:\\\\?deg)(?P<FROM>[CcFf]) "
    replace: "{{result}}"
    vars:
      - name: result
        type: script
        params:
          args:
            - python
            - -c
            - |-
              precision = len("{{NUM}}.0".split(".")[1])

              if "{{FROM}}".upper() == "F":
                num, unit = ({{NUM}} - 32) * 5 / 9, "C"
              else:
                num, unit = {{NUM}} * 9 / 5 + 32, "F"

              print(f"{num:.{precision}f}".rstrip('0').rstrip('.') + "°" + unit)
